spring.application.name=libms
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.example.libms=DEBUG

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


borrower.transaction.limit=5
openlibrary.api.baseurl=https://openlibrary.org

services.email.url=${EMAIL_SERVICE_URL:http://localhost:8082}

rsa.private-key-path=classpath:certs/private.pem
rsa.public-key-path=classpath:certs/public.pem