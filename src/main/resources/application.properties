spring.application.name=libms

spring.datasource.url=jdbc:postgresql://localhost:5432/libms
spring.datasource.username=libms-api
spring.datasource.password=libm$@p1pass

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.example.libms=DEBUG

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

borrower.transaction.limit=5